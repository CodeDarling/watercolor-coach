<!DOCTYPE html>
<html>

<head>
    <title>Watercolor Coach</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Welcome to watercolor coach!</h1>

    
<h2>Search all things watercolor</h2>

<section class="paint-search">
  <label for="userInput">Search your watercolor library</label>

  <input
    type="text"
    id="userInput"
    placeholder="e.g. steam train, light red, flowers, paper brand, pigment codes..."
  >

  <label class="search-option">
    <input type="checkbox" id="extendedSearch">
    Also search notes, related keywords and adjectives, mixes and full content
  </label>

  <button type="button" id="analyzeButton">
    Search
  </button>

  <div id="result" aria-live="polite"></div>
</section>
<a href="#" class="back-to-top" aria-label="Back to top">
  ↑ Back to top
</a>
<script src="script.js"></script>
   
</body>

</html>
