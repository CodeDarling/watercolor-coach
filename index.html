<!DOCTYPE html>
<html>

<head>
    <title>Watercolor Coach</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Welcome to watercolor coach!</h1>

    
<h2>Search anything watercolor</h2>

<section class="paint-search">
  <label for="userInput">Search your paint library</label>

  <input
    type="text"
    id="userInput"
    placeholder="e.g. transparent red"
  >

  <label class="search-option">
    <input type="checkbox" id="extendedSearch">
    Also search notes, AI keywords, mixes and full content
  </label>

  <button type="button" id="analyzeButton">
    Search
  </button>

  <div id="result" aria-live="polite"></div>
</section>

<script src="script.js"></script>
   
</body>

</html>
